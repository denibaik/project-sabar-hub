[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]

[project]
name = "sabar-hub-backend"
version = "0.1.0"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic-settings>=2.6", "pwdlib[argon2]>=0.2"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
